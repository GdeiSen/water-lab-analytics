name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            edition: licensed
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            edition: licensed
          - platform: ubuntu-22.04
            target: ""
            label: linux-x64
            edition: licensed
          - platform: windows-latest
            target: ""
            label: windows-x64
            edition: licensed
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            edition: community
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            edition: community
          - platform: ubuntu-22.04
            target: ""
            label: linux-x64
            edition: community
          - platform: windows-latest
            target: ""
            label: windows-x64
            edition: community

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.edition }} portable on ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure community bundle
        if: matrix.edition == 'community'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.productName = "Water Lab Analytics Community";
          config.identifier = "com.waterlab.analytics.community";
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build portable executable
        shell: bash
        env:
          WLA_LICENSE_REQUIRED: ${{ matrix.edition == 'community' && '0' || '1' }}
          WLA_LICENSE_PUBLIC_KEY: ${{ secrets.WLA_LICENSE_PUBLIC_KEY }}
          WLA_LICENSE_API_URL: ${{ secrets.WLA_LICENSE_API_URL }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --bundles none --target ${{ matrix.target }}
          else
            npx tauri build --bundles none
          fi

      - name: Collect portable binary
        id: bin
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            EXT=".exe"
          else
            EXT=""
          fi

          if [ -n "${{ matrix.target }}" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/water-lab-analytics${EXT}"
          else
            SRC="src-tauri/target/release/water-lab-analytics${EXT}"
          fi

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DEST="dist/water-lab-analytics-${VERSION}-${{ matrix.edition }}-${{ matrix.label }}${EXT}"

          mkdir -p dist
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Water Lab Analytics ${{ github.ref_name }}
          body: Portable executables for Water Lab Analytics (licensed and community editions, no installer).
          draft: true
          prerelease: false
          files: ${{ steps.bin.outputs.path }}
